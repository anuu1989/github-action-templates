# Connection-based custom policy: every aws_s3_bucket must be referenced by a public access block.
metadata:
  id: "CKV2_ORG_2"
  name: "Ensure every S3 bucket has an aws_s3_bucket_public_access_block"
  category: "NETWORKING"
definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: ["aws_s3_bucket"]
      operator: within
    - cond_type: connection
      resource_types: ["aws_s3_bucket"]
      connected_resource_types: ["aws_s3_bucket_public_access_block"]
      operator: exists
