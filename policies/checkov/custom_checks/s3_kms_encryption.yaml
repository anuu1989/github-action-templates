# S3 buckets must be encrypted with SSE-KMS via an aws_s3_bucket_server_side_encryption_configuration.
metadata:
  id: "CKV2_ORG_11"
  name: "Ensure S3 buckets use SSE-KMS encryption"
  category: "ENCRYPTION"
definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: ["aws_s3_bucket"]
      operator: within
    - cond_type: connection
      resource_types: ["aws_s3_bucket"]
      connected_resource_types: ["aws_s3_bucket_server_side_encryption_configuration"]
      operator: exists
    - cond_type: attribute
      resource_types: ["aws_s3_bucket_server_side_encryption_configuration"]
      attribute: rule.apply_server_side_encryption_by_default.sse_algorithm
      operator: within
      value: ["aws:kms", "aws:kms:dsse"]
