# Connection policy: RDS instances must be placed via an explicit DB subnet group (not the default VPC).
metadata:
  id: "CKV2_ORG_6"
  name: "Ensure RDS instances use an explicitly managed aws_db_subnet_group"
  category: "NETWORKING"
definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: ["aws_db_instance"]
      operator: within
    - cond_type: connection
      resource_types: ["aws_db_instance"]
      connected_resource_types: ["aws_db_subnet_group"]
      operator: exists
