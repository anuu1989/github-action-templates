name: dotnet-api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: your-org/github-actions-templates/.github/workflows/dotnet-build.yml@v1
    with:
      dotnet-version: "8.0.x"
      project: src/Api.sln
      publish-project: src/Api/Api.csproj
      artifact-name: api-publish

  codeql:
    uses: your-org/github-actions-templates/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["csharp"]'
      build-mode: autobuild
