# Validate raw manifests + Kustomize overlays + Dockerfile against OPA policies
name: k8s-policy

on:
  pull_request:
    paths: ["k8s/**", "Dockerfile", "policies/**"]

permissions:
  contents: read

jobs:
  manifests:
    uses: anuu1989/github-action-templates/.github/workflows/k8s-validate.yml@v1
    with:
      manifests-path: k8s/base
      kubernetes-version: "1.31.0"
      policy-path: policies/opa/kubernetes

  kustomize-overlays:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: anuu1989/github-action-templates/actions/setup-policy-tools@v1
      - name: Build overlay
        env:
          OVERLAY: ${{ matrix.overlay }}
        run: kubectl kustomize "k8s/overlays/$OVERLAY" > rendered.yaml
      - run: kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
      - run: conftest test rendered.yaml --policy policies/opa/kubernetes --all-namespaces --output github

  dockerfile:
    uses: anuu1989/github-action-templates/.github/workflows/opa-conftest.yml@v1
    with:
      policy-path: policies/opa/docker
      files: Dockerfile
      run-policy-tests: true
