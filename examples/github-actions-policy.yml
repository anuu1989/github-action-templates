# Gate changes to workflows themselves with OPA policies (script injection, pwn requests,
# write-all tokens, unpinned actions, self-hosted runners on PRs, static AWS keys).
name: workflow-policy

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**"]

permissions:
  contents: read

jobs:
  conftest:
    uses: anuu1989/github-action-templates/.github/workflows/opa-conftest.yml@v1
    with:
      policy-path: policies/opa/github-actions
      files: .github/workflows/
      namespace: github_actions

  checkov-gha:
    uses: anuu1989/github-action-templates/.github/workflows/checkov.yml@v1
    with:
      directory: .github/workflows
      framework: github_actions
