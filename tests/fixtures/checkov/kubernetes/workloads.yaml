apiVersion: apps/v1
kind: Deployment
metadata:
  name: pass-web
  namespace: payments
  labels: { app.kubernetes.io/name: web, team: payments }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      containers:
        - name: app
          image: ghcr.io/acme/web:1.4.2
        - name: proxy
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/envoy:1.31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail-web
  namespace: payments
spec:
  selector:
    matchLabels: { app: legacy }
  template:
    metadata:
      labels: { app: legacy }
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
      containers:
        - name: app
          image: docker.io/library/nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: pass-web
  namespace: payments
  labels: { app.kubernetes.io/name: web, team: payments }
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fail-web
  namespace: payments
  labels: { app.kubernetes.io/name: web }
spec:
  rules:
    - host: web.acme.io
