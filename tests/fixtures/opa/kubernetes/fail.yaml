apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      hostNetwork: true
      volumes:
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock }
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            capabilities: { add: [SYS_ADMIN] }
---
apiVersion: v1
kind: Service
metadata:
  name: legacy
  labels: { app.kubernetes.io/name: legacy, team: ops }
spec:
  type: LoadBalancer
  ports: [{ port: 80 }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-admin
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: ci, namespace: ci }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legacy
spec:
  maxUnavailable: 0
