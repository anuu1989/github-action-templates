# Reusable: install, lint, test and build a Node.js project (npm, yarn or pnpm).
name: Node.js Build

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node versions, e.g. ["20","22"]'
        type: string
        default: '["22"]'
      package-manager:
        description: "npm, yarn or pnpm"
        type: string
        default: npm
      pnpm-version:
        description: "pnpm version (leave empty to use package.json 'packageManager')"
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      cache-dependency-path:
        description: "Lockfile path(s) for caching (empty = auto-detect at repo root)"
        type: string
        default: ""
      install-command:
        description: "Override the install command"
        type: string
        default: ""
      lint-script:
        description: "package.json script to lint (skipped if missing)"
        type: string
        default: lint
      test-script:
        description: "package.json script to test (skipped if missing)"
        type: string
        default: test
      build-script:
        description: "package.json script to build (skipped if missing)"
        type: string
        default: build
      artifact-name:
        description: "Upload build output under this artifact name (empty = skip)"
        type: string
        default: ""
      artifact-path:
        description: "Build output directory, relative to working-directory"
        type: string
        default: dist
      runs-on:
        type: string
        default: ubuntu-latest
    secrets:
      NPM_TOKEN:
        description: "Optional token for private npm registries"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            eval "$INSTALL_COMMAND"
            exit 0
          fi
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then yarn install --immutable
              else yarn install --frozen-lockfile; fi ;;
            *) echo "::error::Unknown package manager '$PM'"; exit 1 ;;
          esac

      - name: Lint
        env: { SCRIPT: "${{ inputs.lint-script }}" }
        run: |
          if [ -z "$SCRIPT" ]; then echo "No script configured, skipping"; exit 0; fi
          if node -e 'process.exit((require("./package.json").scripts||{})[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
            "$PM" run "$SCRIPT"
          else
            echo "Script '$SCRIPT' not found in package.json, skipping"
          fi

      - name: Test
        env: { SCRIPT: "${{ inputs.test-script }}" }
        run: |
          if [ -z "$SCRIPT" ]; then echo "No script configured, skipping"; exit 0; fi
          if node -e 'process.exit((require("./package.json").scripts||{})[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
            "$PM" run "$SCRIPT"
          else
            echo "Script '$SCRIPT' not found in package.json, skipping"
          fi

      - name: Build
        env: { SCRIPT: "${{ inputs.build-script }}" }
        run: |
          if [ -z "$SCRIPT" ]; then echo "No script configured, skipping"; exit 0; fi
          if node -e 'process.exit((require("./package.json").scripts||{})[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
            "$PM" run "$SCRIPT"
          else
            echo "Script '$SCRIPT' not found in package.json, skipping"
          fi

      - name: Upload build artifact
        if: inputs.artifact-name != '' && strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
