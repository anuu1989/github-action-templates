# Reusable: GitHub CodeQL SAST for one or more languages.
# Caller permissions needed: contents: read, security-events: write, actions: read
name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array: ["java-kotlin","javascript-typescript","python","go","csharp","ruby","actions"]'
        type: string
        default: '["javascript-typescript"]'
      build-mode:
        description: "none, autobuild or manual"
        type: string
        default: none
      build-command:
        description: "Build command when build-mode is manual"
        type: string
        default: ""
      java-version:
        description: "Install this JDK before analysis (compiled Java builds)"
        type: string
        default: ""
      queries:
        description: "security-extended or security-and-quality"
        type: string
        default: security-extended
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: inputs.java-version != ''
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}

      - name: Manual build
        if: inputs.build-mode == 'manual'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
