# Reusable: Trivy scanner: filesystem deps (SCA), IaC misconfig, secrets, licenses, or a container image.
name: Trivy Scan

on:
  workflow_call:
    inputs:
      scan-type:
        description: "fs, config, image or repo"
        type: string
        default: fs
      scan-ref:
        description: "Path (fs/config/repo) or image reference (image)"
        type: string
        default: "."
      scanners:
        description: "vuln,secret,misconfig,license (fs/repo only)"
        type: string
        default: vuln,secret,misconfig
      severity:
        type: string
        default: CRITICAL,HIGH
      ignore-unfixed:
        type: boolean
        default: true
      fail-build:
        type: boolean
        default: true
      trivyignore:
        description: "Repo-relative .trivyignore file"
        type: string
        default: ""
      upload-sarif:
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  trivy:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-type != 'image' && inputs.scan-ref || '' }}
          image-ref: ${{ inputs.scan-type == 'image' && inputs.scan-ref || '' }}
          scanners: ${{ inputs.scan-type != 'image' && inputs.scanners || '' }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignore }}
          exit-code: ${{ inputs.fail-build && '1' || '0' }}
          format: ${{ inputs.upload-sarif && 'sarif' || 'table' }}
          output: ${{ inputs.upload-sarif && 'trivy.sarif' || '' }}

      - name: Upload SARIF
        if: always() && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.scan-type }}
