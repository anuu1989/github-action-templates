# Reusable: lint (cfn-lint) + optional Checkov + deploy a CloudFormation stack via change set.
# Caller permissions needed: contents: read, id-token: write
name: AWS CloudFormation Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      template:
        description: "Repo-relative template path"
        type: string
        required: true
      stack-name:
        type: string
        required: true
      parameter-overrides:
        description: "Comma-separated Key=Value pairs, or file:///path/params.json"
        type: string
        default: ""
      capabilities:
        type: string
        default: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
      execute-changeset:
        description: "false = only create the change set for review"
        type: boolean
        default: true
      run-checkov:
        type: boolean
        default: true
      aws-region:
        type: string
        default: us-east-1
      aws-role-arn:
        type: string
        required: true
      runs-on:
        type: string
        default: ubuntu-latest
    outputs:
      stack-id:
        value: ${{ jobs.deploy.outputs.stack-id }}

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cfn-lint
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          pip install cfn-lint
          cfn-lint --format parseable "$TEMPLATE"
      - name: Checkov
        if: inputs.run-checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          file: ${{ inputs.template }}
          framework: cloudformation
          quiet: true

  deploy:
    needs: lint
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: cfn-${{ inputs.stack-name }}
      cancel-in-progress: false
    outputs:
      stack-id: ${{ steps.deploy.outputs.stack-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Deploy stack
        id: deploy
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ inputs.stack-name }}
          template: ${{ inputs.template }}
          parameter-overrides: ${{ inputs.parameter-overrides }}
          capabilities: ${{ inputs.capabilities }}
          no-fail-on-empty-changeset: "1"
          no-execute-changeset: ${{ inputs.execute-changeset && '0' || '1' }}
          tags: '[{"Key":"repo","Value":"${{ github.repository }}"},{"Key":"commit","Value":"${{ github.sha }}"}]'
