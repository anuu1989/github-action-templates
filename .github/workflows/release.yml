# Release automation for THIS repo: pushing vX.Y.Z creates a GitHub release with generated notes
# and moves the major tag (vX) so consumers on @vX pick the release up.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag || echo "release exists"
      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$MAJOR -> $TAG" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG" >> "$GITHUB_STEP_SUMMARY"
