# Reusable: secret scanning with Gitleaks CLI (no license needed for orgs).
# On PRs only the new commits are scanned; on other events the full history is scanned.
name: Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.21.2"
      config-path:
        description: "Repo-relative .gitleaks.toml (empty = default rules / repo-root .gitleaks.toml)"
        type: string
        default: ""
      upload-sarif:
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        env:
          CONFIG: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ARGS=(detect --source . --redact --verbose --report-format sarif --report-path gitleaks.sarif)
          [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
          [ -n "$BASE_SHA" ] && ARGS+=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
          gitleaks "${ARGS[@]}"

      - name: Upload SARIF
        if: always() && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
